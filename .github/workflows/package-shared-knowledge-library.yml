name: Package SharedKnowledgeLibrary

on:
  push:
    branches:
      - main
    paths:
      - 'SharedKnowledgeLibrary/**'
      - '.github/workflows/package-shared-knowledge-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill package
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SKILL.md"
            "_LIBRARY_POLICY.md"
            "scheduledprompt.md"
            "bootstrap_migration.md"
            "manifest.example.json"
            "README.md"
          )
          for file in "${required[@]}"; do
            test -f "SharedKnowledgeLibrary/$file" || {
              echo "Missing required package file: SharedKnowledgeLibrary/$file" >&2
              exit 1
            }
          done

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f SharedKnowledgeLibrary.zip SharedKnowledgeLibrary.zip.sha256
          cd SharedKnowledgeLibrary
          zip -9 ../SharedKnowledgeLibrary.zip \
            SKILL.md \
            _LIBRARY_POLICY.md \
            scheduledprompt.md \
            bootstrap_migration.md \
            manifest.example.json \
            README.md
          cd ..
          sha256sum SharedKnowledgeLibrary.zip > SharedKnowledgeLibrary.zip.sha256
          unzip -l SharedKnowledgeLibrary.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharedKnowledgeLibrary-${{ github.sha }}
          path: |
            SharedKnowledgeLibrary.zip
            SharedKnowledgeLibrary.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="shared-knowledge-library-${short_sha}"
          title="SharedKnowledgeLibrary ${short_sha}"
          notes="Installable SharedKnowledgeLibrary Skill package built from commit $GITHUB_SHA. The ZIP has SKILL.md at its archive root and includes all bundled support resources."

          for attempt in 1 2 3 4 5; do
            echo "Release publish attempt $attempt of 5"

            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" \
                SharedKnowledgeLibrary.zip \
                SharedKnowledgeLibrary.zip.sha256 \
                --clobber; then
                exit 0
              fi
            else
              if gh release create "$tag" \
                SharedKnowledgeLibrary.zip \
                SharedKnowledgeLibrary.zip.sha256 \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "$notes"; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 5))
              echo "GitHub release API attempt failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Failed to publish GitHub release after 5 attempts" >&2
          exit 1
